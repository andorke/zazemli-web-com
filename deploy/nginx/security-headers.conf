# Заголовки безопасности прода zazemli.com.
# Ставится в /etc/nginx/snippets/security-headers.conf и подключается include'ом
# из конфига сайта. Держится в репозитории, потому что это часть контракта
# сборки: CSP решает, заработает ли счётчик, который инлайнится на билде.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

# Яндекс.Метрика в списках script-src / connect-src / img-src: счётчик грузит
# скрипт с mc.yandex.ru, отправляет хиты туда же и рисует пиксель. Без этого
# счётчик молча блокируется даже при заданном NEXT_PUBLIC_METRIKA_ID — прежняя
# политика ('self') не пускала его вовсе.
# Сам счётчик подключается только при cookie-согласии «Принять все»: CSP лишь
# перестаёт быть вторым, невидимым стопором.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; font-src 'self'; connect-src 'self' https://mc.yandex.ru; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
