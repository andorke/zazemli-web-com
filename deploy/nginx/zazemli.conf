# nginx-конфиг прода zazemli.com (VPS Рег.облака).
#
# Живёт в репозитории, а не только на сервере: правило про OG-картинку уже
# однажды существовало лишь в /etc/nginx и было бы потеряно при пересоздании
# машины. Ставится в /etc/nginx/sites-available/zazemli и симлинкуется в
# sites-enabled; строки Certbot он не переписывает — они помечены как и раньше.
#
# Раскладка сайта — статический экспорт Next: /var/www/zazemli/guide.html рядом
# с каталогом /var/www/zazemli/guide/ (в нём ветки). Из-за этого путь со слэшем
# попадал в try_files на каталог, autoindex выключён — и nginx отдавал 403.

server {
    server_name zazemli.com;

    root /var/www/zazemli;
    include snippets/security-headers.conf;
    index index.html;

    # Концепты живут вне основного root: deploy.sh с --delete их не затрагивает.
    location = /rubinovoe-more {
        return 301 /rubinovoe-more/$is_args$args;
    }

    # ^~ защищает каталог экспериментов от общего редиректа завершающего слэша.
    location ^~ /rubinovoe-more/ {
        root /var/www/zazemli-experiments;
        index index.html;
        try_files $uri $uri/ =404;
        autoindex off;
        expires -1;
        include snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /_next/static/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # OG-картинка статического экспорта лежит без расширения (out/opengraph-image):
    # без явного типа nginx отдаёт её как application/octet-stream, и соцсети
    # (у которых ещё и nosniff) картинку не рисуют.
    location = /opengraph-image {
        default_type image/png;
    }

    # Печатный QR партии 0 ведёт на /collectio. Страница-редирект в экспорте
    # уводит meta-refresh'ем, но серверный 301 быстрее и понятнее поисковику.
    location = /collectio {
        return 301 /#collectio;
    }

    # Слэш на конце: /guide/ → /guide. Regex-location приоритетнее префиксного,
    # поэтому правило перехватывает такие пути до try_files. Корень «/» под него
    # не попадает: перед слэшем требуется хотя бы один символ.
    location ~ ^(?<path_no_slash>.+)/$ {
        return 301 $path_no_slash$is_args$args;
    }

    location / {
        # $uri/ нужен корню: «/» разрешается в index.html именно им. Пути со
        # слэшем внутри сюда уже не доходят — их перехватывает regex выше,
        # поэтому в каталог-403 упереться больше нечему.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zazemli.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zazemli.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000" always; # managed by Certbot
}

# www отдавал 200 наравне с apex — для поисковика это второй сайт с тем же
# содержимым. Уводим одним 301, сертификат покрывает оба имени.
server {
    server_name www.zazemli.com;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zazemli.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zazemli.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000" always; # managed by Certbot

    return 301 https://zazemli.com$request_uri;
}

# HTTP → HTTPS, сразу на apex: лишний хоп www→www→apex не нужен.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zazemli.com www.zazemli.com;

    return 301 https://zazemli.com$request_uri;
}
