# Общие правила для production и изолированного предпросмотра.
location = / { try_files /index.html =404; }
location = /index.html { return 301 /$is_args$args; }
location = /collectio { return 301 "/$is_args$args#boxes"; }

location ~ ^/snova/(?<again_plant>monstera|ficus|anthurium|aglaonema|spathiphyllum|zamioculcas|epipremnum)$ {
    return 301 "/?plant=$again_plant$paper_extra_query#boxes";
}

location = /guide/polnaya-zamena { return 301 /guide$is_args$args; }
location = /guide/polnaya_zamena { return 301 /guide$is_args$args; }
location = /guide-polnaya-zamena.html { return 301 /guide$is_args$args; }
location = /guide-perevalka.html { return 301 /guide/perevalka$is_args$args; }
location ~ ^/(?<short_page>guide|lab|diary-signup|privacy|terms)\.html$ {
    return 301 /$short_page$is_args$args;
}

location ~ ^/api/(?:status|diary/subscribe|waitlist/(?:plant|email))$ {
    limit_req zone=zazemli_forms burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Host $host;
    error_page 502 504 =503 @zazemli_forms_unavailable;
    proxy_pass http://127.0.0.1:8433;
}

location @zazemli_forms_unavailable {
    default_type application/json;
    return 503 '{"error":"email_unconfigured"}';
}

location /api/ { return 404; }

location ~ ^(?<path_no_slash>.+)/$ {
    return 301 $path_no_slash$is_args$args;
}

location = /404.html { internal; }
error_page 404 /404.html;

location / { try_files $uri $uri.html =404; }
